<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Power - Consumer Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" style="text-decoration: none; font-size: 0.8rem; color: var(--primary-blue);">← Back to Selection</a>
            <h2 style="margin-top: 1rem;">Consumer Portal</h2>
            <form id="loginForm">
                <input type="hidden" id="loginType" value="consumer">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <div class="auth-links">
                <p>New consumer? <a href="signup.html">Register here</a></p>
            </div>
        </div>
    </div>
    <script src="js/auth.js?v=2"></script>
</body>
</html>
