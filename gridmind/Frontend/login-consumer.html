<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Power - Consumer Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" style="text-decoration: none; font-size: 0.8rem; color: var(--primary-blue);">← Back to Selection</a>
            <h2 style="margin-top: 1rem;">Consumer Portal</h2>
            <form id="loginForm">
                <input type="hidden" id="loginType" value="consumer">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div class="auth-links" id="forgot-link-container">
                    <a href="#" onclick="toggleForms('forgot')">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <form id="forgotForm" style="display: none;">
                <h2>Reset Password</h2>
                <p style="text-align:center; color:var(--text-muted); font-size:0.875rem; margin-bottom:1rem;">Enter your email to receive a 6-digit OTP.</p>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmail" placeholder="e.g. aditri@example.com" required>
                </div>
                
                <button type="submit" class="btn-primary" id="btn-send-otp">Send OTP</button>
                
                <div class="auth-links">
                    <a href="#" onclick="toggleForms('login')">Back to Login</a>
                </div>
            </form>

            <form id="resetForm" style="display: none;">
                <h2>Enter OTP</h2>
                <p style="text-align:center; color:var(--text-muted); font-size:0.875rem; margin-bottom:1rem;">Check your email for the 6-digit code.</p>
                
                <div class="form-group">
                    <label>6-Digit OTP</label>
                    <input type="text" id="resetOtp" placeholder="123456" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                </div>
                
                <button type="submit" class="btn-primary" id="btn-reset-pw">Reset Password</button>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
