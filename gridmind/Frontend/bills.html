<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Power - Bills</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .filter-bar {
            display: flex; gap: 1rem; margin-bottom: 1.5rem; background: white; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; flex: 1; outline: none;
        }
        .filter-bar input:focus, .filter-bar select:focus { border-color: var(--primary-blue); }
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { background-color: #f9fafb; color: var(--primary-blue); }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">⚡ Smart Power</div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="power-grids.html">Power Grids</a></li>
                <li><a href="distribution-areas.html">Distribution Areas</a></li>
                <li><a href="consumers.html">Consumers</a></li>
                <li><a href="connections.html">Connections</a></li>
                <li><a href="meter-readings.html">Meter Readings</a></li>
                <li><a href="bills.html" class="active">Bills</a></li>
                <li><a href="analytics.html">Analytics</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>All Bills</h1>
            </div>
            
            <div class="filter-bar">
                <input type="text" id="searchConn" placeholder="Search Connection ID...">
                <input type="month" id="searchMonth" title="Filter by Month">
                <select id="searchStatus">
                    <option value="">All Statuses</option>
                    <option value="Paid">Paid</option>
                    <option value="Unpaid">Unpaid</option>
                    <option value="Overdue">Overdue</option>
                </select>
            </div>

            <div class="table-card">
                <table class="data-table" id="billsTable">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="bill_id">Bill ID ↕</th>
                            <th class="sortable" data-sort="connection_id">Conn ID ↕</th>
                            <th class="sortable" data-sort="month">Month ↕</th>
                            <th class="sortable" data-sort="units">Units ↕</th>
                            <th class="sortable" data-sort="amount">Amount ↕</th>
                            <th>Status</th>
                            <th class="sortable" data-sort="due_date">Due Date ↕</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <script src="js/common.js"></script>
    <script src="js/bills.js"></script>
</body>
</html>
