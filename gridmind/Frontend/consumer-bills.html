<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Power - My Bills</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">⚡ Smart Power</div>
            <ul class="sidebar-nav">
                <li><a href="consumer-dashboard.html">My Dashboard</a></li>
                <li><a href="consumer-connections.html">My Smart Meters</a></li>
                <li><a href="consumer-bills.html" class="active">My Bills & Payments</a></li>
                <li><a href="consumer-profile.html">My Profile</a></li>
                <li style="margin-top: 2rem;"><a href="#" class="btn-logout" onclick="logout()">Log Out</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>My Bills & Payments</h1>
            </div>
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Bill ID</th><th>Connection ID</th><th>Month</th><th>Units</th><th>Amount</th><th>Status</th><th>Due Date</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>
    
    <script src="js/common.js"></script>
    <script src="js/consumer-portal.js"></script>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePaymentModal()">&times;</span>
            <h2>Complete Your Payment</h2>
            <p id="paymentDetails">Paying Bill #... Amount: ₹...</p>
            <img src="images/qr.png" alt="UPI QR Code" class="qr-code">
            <p class="timer">Awaiting payment... <span id="countdown">04:59</span></p>
            <button id="simulateSuccessBtn" class="pay-btn">Simulate Payment Success</button>
        </div>
    </div>

</body>
</html>
