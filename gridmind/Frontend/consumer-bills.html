<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Power - My Bills</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">⚡ Smart Power</div>
            <ul class="sidebar-nav">
                <li><a href="consumer-dashboard.html">My Dashboard</a></li>
                <li><a href="consumer-connections.html">My Smart Meters</a></li>
                <li><a href="consumer-bills.html" class="active">My Bills & Payments</a></li>
                <li><a href="consumer-profile.html">My Profile</a></li>
                <li style="margin-top: 2rem;"><a href="#" class="btn-logout" onclick="logout()">Log Out</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>My Bills & Payments</h1>
            </div>
            <div class="table-card">
                <table class="data-table" id="consumerBillsTable">
                    <thead>
                        <tr>
                            <th>Month</th><th>Conn ID</th><th>Amount</th><th>Status</th><th>Due Date</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>
    
    <script src="js/common.js"></script>
    <script src="js/consumer-portal.js"></script>

    <div id="paymentModal" class="modal-overlay" style="display:none; align-items:center; justify-content:center;">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <span class="close-btn" onclick="closePaymentModal()" style="float: right;">✕</span>
            <h2 style="margin-top: 0;">Complete Your Payment</h2>
            <p id="paymentDetails" style="color: #4B5563; margin-bottom: 20px;">Paying Bill #... Amount: ₹...</p>
            <div style="background: #f3f4f6; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                <p style="font-weight: bold; margin-bottom: 10px;">Scan to Pay</p>
                <div style="width: 150px; height: 150px; background: #ddd; margin: 0 auto; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc;">
                    [ QR Code Placeholder ]
                </div>
            </div>
            <p class="timer" style="color: #DC2626; font-weight: bold;">Awaiting payment... <span id="countdown">04:59</span></p>
            <button id="simulateSuccessBtn" class="btn-primary" style="width: 100%; margin-top: 10px;">Simulate Payment Success</button>
        </div>
    </div>
    <a href="consumer-support.html" class="floating-support-btn" title="Help Desk">
        💬
    </a>
</body>
</html>
