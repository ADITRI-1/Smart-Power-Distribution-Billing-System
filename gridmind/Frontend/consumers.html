<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Power - Consumers</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">⚡ Smart Power</div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="power-grids.html">Power Grids</a></li>
                <li><a href="distribution-areas.html">Distribution Areas</a></li>
                <li><a href="consumers.html" class="active">Consumers</a></li>
                <li><a href="connections.html">Connections</a></li>
                <li><a href="meter-readings.html">Meter Readings</a></li>
                <li><a href="bills.html">Bills</a></li>
                <li><a href="analytics.html">Analytics</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Consumers</h1>
                <button class="btn-add"><span>+</span> Add Consumer</button>
            </div>
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Address</th><th>Age</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

            <div class="modal-overlay" id="consumerModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Consumer Profile & Grid Links</h2>
                        <span class="close-btn" onclick="closeModal()">✕</span>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;" id="modalBasicInfo">
                        </div>

                    <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-main);">Linked Meters & Grid Data</h3>
                    <div class="table-card" style="box-shadow: none; margin-bottom: 0;">
                        <table class="data-table" id="modalConnectionsTable">
                            <thead>
                                <tr>
                                    <th>Conn ID</th><th>Grid Source</th><th>Zone/City</th><th>Load</th><th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
    <script src="js/common.js"></script> <script src="js/consumers.js"></script>
</body>
</html>
