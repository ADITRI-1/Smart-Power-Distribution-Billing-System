<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Smart Power</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">⚡ Smart Power</div>
            <ul class="sidebar-nav">
                <li><a href="consumer-dashboard.html">My Dashboard</a></li>
                <li><a href="consumer-connections.html">My Smart Meters</a></li>
                <li><a href="consumer-bills.html">My Bills & Payments</a></li>
                <li><a href="consumer-profile.html">My Profile</a></li>
                <li><a href="consumer-support.html" class="active">Help Desk / Support</a></li>
                <li style="margin-top: 2rem;"><a href="#" class="btn-logout" onclick="logout()">Log Out</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Your Support Tickets</h1>
                <button onclick="openNewTicketModal()" class="btn-add">+ Create New Ticket</button>
            </div>

            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Subject</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsTableBody">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="newTicketModal" class="modal">
        <div class="modal-content" style="text-align: left;">
            <span class="close-btn" onclick="closeModal('newTicketModal')">&times;</span>
            <h2 style="margin-bottom: 1.5rem;">Create a New Support Request</h2>
            
            <div class="form-group">
                <label>Subject:</label>
                <input type="text" id="ticketSubject" placeholder="Brief subject of your issue">
            </div>
            
            <div class="form-group">
                <label>Message:</label>
                <textarea id="ticketMessage" rows="5" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none; font-family: inherit;" placeholder="Describe your issue in detail..."></textarea>
            </div>
            
            <button class="btn-primary" onclick="submitTicket()">Submit Ticket</button>
        </div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content" style="text-align: left; max-width: 600px;">
            <span class="close-btn" onclick="closeModal('chatModal')">&times;</span>
            <h2 id="chatSubject" style="margin-bottom: 0.5rem;">Ticket Thread</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.875rem;">
                Status: <span id="chatStatus" class="badge"></span>
            </p>
            
            <div id="chatBox" class="chat-box">
                </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="replyMessage" placeholder="Type your reply here..." style="flex: 1; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none;">
                <button class="btn-primary" style="margin-top: 0; width: auto;" onclick="sendReply()">Send Reply</button>
            </div>
        </div>
    </div>

    <script src="js/consumer-support.js"></script>
</body>
</html>
