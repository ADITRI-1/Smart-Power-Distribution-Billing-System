<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Help Desk - Smart Power</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">⚡ Smart Power</div>
            <ul class="sidebar-nav">
                <li><a href="consumer-dashboard.html">My Dashboard</a></li>
                <li><a href="consumer-connections.html">My Smart Meters</a></li>
                <li><a href="consumer-bills.html">My Bills & Payments</a></li>
                <li><a href="consumer-profile.html">My Profile</a></li>
                <li><a href="consumer-support.html" class="active">Help Desk</a></li>
                <li style="margin-top: 2rem;"><a href="#" class="btn-logout" onclick="logout()">Log Out</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Help Desk & Support</h1>
                <button onclick="openNewTicketModal()" class="btn-add">+ Create New Ticket</button>
            </div>

            <div class="table-card">
                <table class="data-table" id="supportTicketsTable">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Subject</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsTableBody">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="newTicketModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Support Request</h2>
                <span class="close-btn" onclick="closeModal('newTicketModal')">&times;</span>
            </div>
            
            <div class="form-group">
                <label for="ticketSubject">Subject:</label>
                <input type="text" id="ticketSubject" placeholder="Brief summary of your issue">
            </div>
            
            <div class="form-group">
                <label for="ticketMessage">Message:</label>
                <textarea id="ticketMessage" rows="5" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; resize: vertical;" placeholder="Provide details..."></textarea>
            </div>
            
            <button onclick="submitTicket()" class="btn-primary">Submit Ticket</button>
        </div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="chatSubject">Ticket Thread</h2>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span id="chatStatus" class="badge"></span>
                    <span class="close-btn" onclick="closeModal('chatModal')">&times;</span>
                </div>
            </div>
            
            <div id="chatBox" class="chat-box">
                </div>
            
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">
                <input type="text" id="replyMessage" placeholder="Type your reply here..." style="flex: 1; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; outline: none;">
                <button onclick="sendReply()" class="btn-add">Send Reply</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/consumer-support.js"></script>
</body>
</html>
