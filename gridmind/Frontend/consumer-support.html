<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Smart Power</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Basic styling for the chat thread */
        .chat-box { max-height: 400px; overflow-y: auto; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; margin-bottom: 15px; }
        .message { padding: 10px; margin-bottom: 10px; border-radius: 8px; max-width: 80%; }
        .msg-consumer { background-color: #d1e7dd; margin-left: auto; text-align: right; }
        .msg-admin { background-color: #e2e3e5; margin-right: auto; text-align: left; }
        .msg-time { font-size: 0.8em; color: #666; margin-top: 5px; display: block; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        .status-Open { background: #f8d7da; color: #842029; }
        .status-In-Progress { background: #fff3cd; color: #664d03; }
        .status-Resolved { background: #d1e7dd; color: #0f5132; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; width: 50%; margin: 5% auto; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <h2>Smart Power - Help Desk</h2>
        <nav>
            <a href="consumer-dashboard.html">Back to Dashboard</a>
            <button onclick="logout()">Logout</button>
        </nav>
    </header>

    <main style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Your Support Tickets</h3>
            <button onclick="openNewTicketModal()" style="padding: 10px 15px; background: #0d6efd; color: white; border: none; cursor: pointer;">+ Create New Ticket</button>
        </div>

        <table style="width: 100%; margin-top: 20px; border-collapse: collapse;" border="1">
            <thead>
                <tr style="background: #f1f1f1;">
                    <th>Ticket ID</th>
                    <th>Subject</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ticketsTableBody">
                </tbody>
        </table>
    </main>

    <div id="newTicketModal" class="modal">
        <div class="modal-content">
            <h3>Create a New Support Request</h3>
            <label>Subject:</label><br>
            <input type="text" id="ticketSubject" style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
            <label>Message:</label><br>
            <textarea id="ticketMessage" rows="5" style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea><br>
            <button onclick="submitTicket()">Submit Ticket</button>
            <button onclick="closeModal('newTicketModal')">Cancel</button>
        </div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content">
            <h3 id="chatSubject">Ticket Thread</h3>
            <p>Status: <span id="chatStatus"></span></p>
            <div id="chatBox" class="chat-box">
                </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="replyMessage" placeholder="Type your reply here..." style="flex: 1; padding: 10px;">
                <button onclick="sendReply()">Send Reply</button>
            </div>
            <button onclick="closeModal('chatModal')" style="margin-top: 15px; width: 100%;">Close Window</button>
        </div>
    </div>

    <script src="js/consumer-support.js"></script>
</body>
</html>
